# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Group minor/patch updates together to reduce PR noise
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore major updates for sqlite3 due to tar vulnerability workaround
      - dependency-name: "sqlite3"
        update-types: ["version-update:semver-major"]
      # Pinned to 2.26.1, the last release without node-forge: every node-forge
      # release is covered by GHSA-86w9-cpqp-85rv and none is patched (#551).
      # Remove this (and the exact pin in package.json) once dotenvx ships a
      # release whose dependencies pass `npm audit --omit=dev`.
      - dependency-name: "@dotenvx/dotenvx"
