name: Security Audit

on:
  # `npm audit` is a required status check in branch protection, so it must
  # run on every PR and on pushes to main — otherwise PRs are permanently
  # blocked waiting for a check that never reports.
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Run weekly on Monday at 9am UTC to catch new vulnerabilities
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        id: audit
        run: |
          set +e
          # The gate covers runtime dependencies only. Dev-only advisories are
          # reported below but do not fail the build: some are unfixable without
          # breaking the toolchain. brace-expansion is the standing example —
          # every version up to 5.0.7 is vulnerable, the patched 5.x line
          # exports an object rather than a callable from `require()`, and
          # minimatch/glob/jest all call it as a function. Overriding it breaks
          # the test runner; not overriding it leaves an advisory that no
          # dependency bump can clear. Gating on it blocks every PR
          # indefinitely for a DoS in code that never ships.
          audit_output=$(npm audit --omit=dev --audit-level=high 2>&1)
          audit_exit=$?

          dev_output=$(npm audit --audit-level=high 2>&1)
          dev_exit=$?
          set -e

          echo "$audit_output"

          {
            echo "## Security Audit Results"
            echo ""
            echo "### Runtime dependencies (gating)"
            if [ $audit_exit -eq 0 ]; then
              echo "No high or critical vulnerabilities found"
            else
              echo '```'
              echo "$audit_output"
              echo '```'
            fi

            echo ""
            echo "### Including dev dependencies (informational)"
            if [ $dev_exit -eq 0 ]; then
              echo "No high or critical vulnerabilities found"
            else
              echo "Not gating — see the note in \`.github/workflows/security.yml\`."
              echo '```'
              echo "$dev_output"
              echo '```'
            fi
          } >> $GITHUB_STEP_SUMMARY

          exit $audit_exit

      - name: Open issue on failure
        # On a PR the failing check is signal enough; only file a tracking
        # issue for scheduled/main runs so PRs don't spam duplicate issues.
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Security audit found high/critical vulnerabilities in runtime dependencies"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Issue #$existing already open, skipping"
            exit 0
          fi
          gh issue create \
            --title "$title" \
            --body "The \`Security Audit\` workflow found high or critical vulnerabilities. See the [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) for the audit output. Run \`npm audit\` locally to reproduce."
