# Streaks Habits Plugin
# Syncs habit tracking data from the Streaks iOS app backup files

name = "streaks-habits"
displayName = "Streaks Habits"
description = "Habit data from the Streaks iOS app backup files"
type = "habits"


longDescription = """
Provides AI access to habit data exported from the Streaks iOS app
(https://streaksapp.com).

Setup:
1. Install and use Streaks on your iPhone or iPad
2. In Streaks, go to Settings > Data > Export
3. Save the exported `.streaks` backup file into `vault/logs/`
   (or another configured logs directory)
4. Run `bin/plugins sync streaks-habits`

The plugin reads the latest `.streaks` file and imports:
- Habit definitions including title, category, and goal type
- Daily completion status for the retention window
- Current streak counts for each habit
- Pending entries for today when a habit has no completion yet

Archived habits are skipped. Each database row represents one habit on one day.
"""

aiInstructions = """
Streaks habit data is stored in the `habits` table with source LIKE
'streaks-habits/%'. Each row is one habit for one day.

Key fields:
- title: habit name
- date: day for this entry (YYYY-MM-DD)
- status: completed, pending, skipped, or partial
- goal_type: achieve or limit
- value: numeric progress such as timer seconds
- category: habit category/group
- metadata.current_streak: current streak length
- metadata.target_type: boolean, count, or timer
- metadata.paused: whether the habit is paused in Streaks

For limit habits, partial progress can still count toward the current streak even
when status is `partial`.

Today's active habits:
  SELECT title, status, goal_type,
         json_extract(metadata, '$.current_streak') AS streak
  FROM habits
  WHERE source LIKE 'streaks-habits/%'
    AND date = DATE('now')
    AND COALESCE(json_extract(metadata, '$.paused'), 0) = 0
  ORDER BY status, title

Habits with the longest current streaks:
  SELECT title, json_extract(metadata, '$.current_streak') AS streak
  FROM habits
  WHERE source LIKE 'streaks-habits/%'
    AND date = DATE('now')
  ORDER BY streak DESC, title
"""

[commands]
read = "./read.js"

[settings]
logs_directory = { type = "string", default = "vault/logs", description = "Directory containing .streaks backup files" }
retention_days = { type = "number", default = 30, description = "Days of history to keep in database" }
cleanup_old_files = { type = "boolean", default = false, description = "Delete all .streaks files except the latest one after reading" }
