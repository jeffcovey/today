# Markdownlint Cleanup Plugin
# Auto-fixes markdown formatting issues using markdownlint

name = "markdownlint-cleanup"
displayName = "Markdownlint Cleanup"
description = "Auto-fix markdown formatting issues using markdownlint"
type = "utility"


longDescription = """
Uses the markdownlint Node API to automatically correct markdown formatting
issues in your vault files.

This plugin uses the markdownlint Node API directly, so it needs no external
command-line tool.

## Common Fixes

- Consistent heading styles
- Proper list indentation
- Blank lines around headings and code blocks
- Trailing whitespace removal (configurable)

Configure rules in .markdownlint.jsonc at the project root.
"""

[commands]
read = "./read.js"

[settings]
directory = { type = "string", default = "vault/**/*.md", description = "Directory root to recursively scan for Markdown files. The legacy /*.md suffix is accepted but does not limit scanning to top-level files." }
