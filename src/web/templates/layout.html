<!DOCTYPE html>
<html lang="en">
<head>
  <title>{{title}}</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{themeBootstrapScript}}
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet"/>
  <!-- MDB -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.1.0/mdb.min.css" rel="stylesheet"/>
  <!-- Custom styles -->
  <link href="/static/css/style.css?v={{staticVersion}}" rel="stylesheet"/>
  {{head}}
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid has-display-menu">
      <a class="navbar-brand" href="/" title="Today">
        <i class="fas fa-folder-open" aria-hidden="true"></i><span class="navbar-brand-text d-none d-sm-inline ms-2">Today</span>
      </a>
      {{displayMenu}}
      {{navbarSearch}}
    </div>
    {{navbarSearchRow}}
  </nav>

  <!-- Main content -->
  <div class="container-fluid mt-3">
    {{content}}
  </div>

  <!-- MDB -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.1.0/mdb.umd.min.js"></script>
  <!-- Common scripts -->
  <script src="/static/js/common.js?v={{staticVersion}}"></script>
  {{scripts}}
</body>
</html>
